name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p release_preparation_test.py
      - run: python tools/release/prepare.py check
      - run: python tools/release/prepare.py source --output target/release
      - uses: actions/upload-artifact@v4
        with:
          name: source-preview-${{ matrix.os }}
          path: target/release/*
